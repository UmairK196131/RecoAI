# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "bffdc0564c325e292f5db11944d65851"
name = "RecoAI"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Minimum scopes per docs/tech-stack.md
scopes = "read_products,read_orders,read_customers,read_inventory,read_content"
optional_scopes = []
use_legacy_install_flow = false

[auth]
redirect_urls = ["https://example.com/api/auth"]

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/create"
  topics = ["products/create"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = ["products/update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/delete"
  topics = ["products/delete"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/collections/update"
  topics = ["collections/update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/inventory_levels/update"
  topics = ["inventory_levels/update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = ["orders/create"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/updated"
  topics = ["orders/updated"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = ["orders/paid"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/create"
  topics = ["customers/create"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/update"
  topics = ["customers/update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true
