# Dev-only config: catalog webhooks only (no protected customer data).
# Use while Partner Dashboard PCD access is being configured.
# Run: npm run dev:lite
# Full Sprint 5 webhooks: enable PCD in Partner Dashboard, then use `npm run dev`.

client_id = "bffdc0564c325e292f5db11944d65851"
name = "RecoAI"
application_url = "https://example.com"
embedded = true

[access_scopes]
scopes = "read_products,read_orders,read_customers,read_inventory,read_content"
optional_scopes = []
use_legacy_install_flow = false

[auth]
redirect_urls = ["https://example.com/api/auth"]

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/create"
  topics = ["products/create"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = ["products/update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/delete"
  topics = ["products/delete"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/collections/update"
  topics = ["collections/update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/inventory_levels/update"
  topics = ["inventory_levels/update"]

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true
